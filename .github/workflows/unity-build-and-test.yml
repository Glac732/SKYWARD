name: SKYWARD Unity Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-build-and-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: skyward-unity-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Check Unity licence and project prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Unity licence secrets are configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE repository secret is missing. Add an activated Unity Personal/Plus/Pro license file as Settings > Secrets and variables > Actions > New repository secret, name UNITY_LICENSE. Do not paste a license into source files or logs."
            exit 1
          fi
          echo "Unity licence secret is present (value intentionally not printed)."
      - name: Verify expected Unity editor version
        run: |
          test "$(cat ProjectSettings/ProjectVersion.txt)" = "m_EditorVersion: 6000.3.0f1"
          echo "Unity 6000.3.0f1 project version confirmed."

  unity-tests:
    name: Unity EditMode and PlayMode tests
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity6000.3.0f1-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity6000.3.0f1-Tests-
      - name: Run all Unity tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.0f1
          testMode: all
          coverageEnabled: false
          artifactsPath: artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: SKYWARD Unity Test Results
      - name: Upload Unity test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKYWARD-Unity-Test-Results
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  build-windows:
    name: Build Windows x64 player
    needs: [preflight, unity-tests]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity6000.3.0f1-Windows-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity6000.3.0f1-Windows-
      - name: Build Windows x64
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.0f1
          targetPlatform: StandaloneWindows64
          buildMethod: Skyward.Editor.SkywardBuildAutomation.BuildWindows
          buildsPath: build
      - name: Package Windows player
        run: |
          test -f BuildOutput/Windows/SKYWARD.exe
          cd BuildOutput/Windows
          zip -r ../../SKYWARD-Windows-x64.zip .
          cd ../..
          sha256sum SKYWARD-Windows-x64.zip > SKYWARD-Windows-x64.sha256
      - name: Upload Windows player
        uses: actions/upload-artifact@v4
        with:
          name: SKYWARD-Windows-x64
          path: |
            SKYWARD-Windows-x64.zip
            SKYWARD-Windows-x64.sha256
          if-no-files-found: error
          retention-days: 30

  build-android:
    name: Build Android ARM64 APK
    needs: [preflight, unity-tests]
    if: ${{ always() && needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Unity6000.3.0f1-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Unity6000.3.0f1-Android-
      - name: Build Android ARM64 APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.0f1
          targetPlatform: Android
          buildMethod: Skyward.Editor.SkywardBuildAutomation.BuildAndroid
          buildsPath: build
      - name: Verify and checksum APK
        run: |
          test -f BuildOutput/Android/SKYWARD.apk
          sha256sum BuildOutput/Android/SKYWARD.apk > SKYWARD-Android-ARM64.sha256
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SKYWARD-Android-ARM64-APK
          path: |
            BuildOutput/Android/SKYWARD.apk
            SKYWARD-Android-ARM64.sha256
          if-no-files-found: error
          retention-days: 30

  summary:
    name: Build and test summary
    needs: [preflight, unity-tests, build-windows, build-android]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write honest result summary
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          TESTS: ${{ needs.unity-tests.result }}
          WINDOWS: ${{ needs.build-windows.result }}
          ANDROID: ${{ needs.build-android.result }}
        run: |
          {
            echo "# SKYWARD CI result"
            echo ""
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Unity licence preflight | $PREFLIGHT |"
            echo "| EditMode + PlayMode tests | $TESTS |"
            echo "| Windows x64 player | $WINDOWS |"
            echo "| Android ARM64 APK | $ANDROID |"
            echo ""
            echo "A successful source-validation workflow is not a substitute for this Unity run."
            echo "A generated player is not a release-ready game unless its tests and manual device checks pass."
          } >> "$GITHUB_STEP_SUMMARY"
